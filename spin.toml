#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "http-status"
version = "0.1.0"
authors = ["Kevin Ege"]
description = "Returns the HTTP status specified by the ?status= query parameter"
targets = ["akamai-functions"]

[[trigger.http]]
route = "/..."
component = "http-status"

[component.http-status]
source = "target/wasm32-wasip2/release/http_status.wasm"
allowed_outbound_hosts = []
[component.http-status.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
